[project]
name = "hik-server"
version = "0.1.0"
description = "Backend for Hikvision video intercoms: ISAPI call control, WebSocket state, go2rtc proxy"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "uvicorn[standard]>=0.32",
  "websockets>=14",
]

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.mypy]
strict = true
packages = ["hik_server", "tests"]
