[package]
name = "hik-windows-client"
version = "0.1.0"
description = "Hikvision Doorbell Windows Client"
authors = ["you"]
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["system-tray", "shell-open", "window-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures-util = "0.3"
native-tls = "0.2"
auto-launch = "0.5"
anyhow = "1.0"
chrono = "0.4"
dirs = "7.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
opt-level = "s"
lto = true
panic = "abort"

[profile.dev]
strip = false
opt-level = 0
lto = false
panic = "unwind"
