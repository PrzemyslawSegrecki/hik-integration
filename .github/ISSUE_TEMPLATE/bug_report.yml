name: Bug report
description: Something does not work
body:
  - type: input
    id: model
    attributes:
      label: Doorbell model and firmware
      placeholder: DS-KV8113-WME1(C), V2.2.78
    validations: {required: true}
  - type: dropdown
    id: install
    attributes:
      label: How do you run it?
      options: [Docker (GHCR image), Docker (built locally), Development setup, Windows client]
    validations: {required: true}
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: Logs / connection test output
      description: "`docker compose logs hik-doorbell`. Remove passwords, tokens and public addresses first."
      render: text
