name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: apps/server
      - run: npm ci
      - run: uv sync --directory apps/server --frozen
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
