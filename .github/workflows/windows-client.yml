name: Windows client

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows/src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build installers
        run: npx --yes @tauri-apps/cli@1 build

      - uses: actions/upload-artifact@v7
        with:
          name: hik-windows-client
          path: |
            apps/windows/src-tauri/target/release/bundle/msi/*.msi
            apps/windows/src-tauri/target/release/bundle/nsis/*.exe

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/windows/src-tauri/target/release/bundle/msi/*.msi
            apps/windows/src-tauri/target/release/bundle/nsis/*.exe
